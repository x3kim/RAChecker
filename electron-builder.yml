# Packaging config for the RAChecker desktop app (npm run app:dist).
appId: de.rachecker.app
productName: RAChecker
copyright: "Spieldaten © retroachievements.org"

# No asar: the server spawns bundled binaries (RAHasher, 7za) and reads its
# own tree via plain fs paths — a real directory keeps all of that working.
asar: false

directories:
  output: release
  buildResources: build

# Update feed for electron-updater. Generates latest.yml alongside the exe; the
# app checks this repo's GitHub releases and auto-downloads newer versions.
publish:
  provider: github
  owner: x3kim
  repo: RAChecker

files:
  - electron/**/*
  - server/src/**/*
  - server/package.json
  - server/config.local.example.json
  - web/dist/**/*
  - bin/**/*
  - package.json
  - "!server/config.local.json" # never ship personal credentials
  - "!data/**"
  - "!release/**"

win:
  target:
    - target: nsis
    - target: portable
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  license: LICENSE
  # Space-free name so the on-disk file, latest.yml url and the uploaded GitHub
  # asset all match — otherwise electron-updater 404s on the download.
  artifactName: "RAChecker-Setup-${version}.exe"

portable:
  artifactName: "RAChecker-${version}-portable.exe"
